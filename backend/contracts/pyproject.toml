[project]
name = "hulu-contracts"
version = "0.0.1"
description = "Event models, port and query interfaces, shared types (spec sections 8 and 9)."
requires-python = ">=3.12"
dependencies = ["hulu-kernel", "pydantic>=2.7"]

[tool.uv.sources]
hulu-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hulu_contracts"]
