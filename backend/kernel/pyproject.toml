[project]
name = "hulu-kernel"
version = "0.0.1"
description = "Platform services every block uses (spec section 5). M0: manifest, registry, app factory."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6", "fastapi>=0.115"]

[project.scripts]
hulu-kernel = "hulu_kernel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hulu_kernel"]
