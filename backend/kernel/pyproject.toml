[project]
name = "mek-kernel"
version = "0.0.1"
description = "Platform services every block uses (spec section 5). M0: manifest, registry, app factory."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6", "fastapi>=0.115"]

[project.scripts]
mek-kernel = "mek_kernel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mek_kernel"]
