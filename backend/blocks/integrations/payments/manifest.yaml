# The only file the registry reads (spec 6.1). Status 'proposed': the contract is planned, the code is not built yet.
id: integrations.payments
version: 0.1.0
status: proposed
steward: platform-leads
summary: Payment records and checkout for online and offline channels, with receipts and invoices; adapters for manual review
  and Chapa.
provides:
- PaymentProviderV1
requires:
- NotifierV1
- DocumentsV1
- NumberingV1
- FilesV1
- TaxServiceV1
- AuditV1
events_emitted:
- payment.confirmed@1
- payment.refunded@1
events_consumed:
- account.erased@1
permissions:
- payments.payment.view
- payments.payment.approve
- payments.payment.record
- payments.receipt.view
settings_model: hulu_payments.settings:Settings
offline: false
tiers:
- dedicated_hosted
- on_premise
- shared_saas
