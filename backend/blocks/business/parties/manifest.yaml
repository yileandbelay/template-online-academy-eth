# The only file the registry reads (spec 6.1). Status 'proposed': the contract is planned, the code is not built yet.
id: business.parties
version: 0.1.0
status: proposed
steward: platform-leads
summary: People and organisations with contact details and roles (student, teacher, staff); links a login to a business record.
provides:
- PartyQueryV1
- PartyPortV1
requires:
- AuditV1
events_emitted:
- party.created@1
- party.erased@1
events_consumed:
- account.erased@1
permissions:
- parties.party.view
- parties.party.edit
- parties.contact.view
settings_model: mek_parties.settings:Settings
offline: false
tiers:
- dedicated_hosted
- on_premise
- shared_saas
