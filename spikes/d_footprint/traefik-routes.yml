http:
  routers:
    api: { rule: "PathPrefix(`/api`) || Path(`/healthz`)", service: api, entryPoints: [web] }
    auth: { rule: "PathPrefix(`/realms`) || PathPrefix(`/resources`)", service: auth, entryPoints: [web] }
    web: { rule: "PathPrefix(`/`)", service: web, entryPoints: [web], priority: 1 }
  services:
    api: { loadBalancer: { servers: [ { url: "http://api:8001" } ] } }
    auth: { loadBalancer: { servers: [ { url: "http://keycloak:8080" } ] } }
    web: { loadBalancer: { servers: [ { url: "http://web:3055" } ] } }
