# Local development services. Nothing here is a deployment: deployment waits until the product matures (ADR-015).
# Start:  docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mek
      POSTGRES_PASSWORD: mek-dev-only
      POSTGRES_DB: mek
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mek"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
